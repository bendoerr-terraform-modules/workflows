# Self-CI. Every workflow in this repo is workflow_call-only, so it has never
# validated itself: 55 runs in its whole history, all Dependabot's update
# machinery, while 13 consumer repos and 82 call sites depend on it. A change to
# the shared lint/release DNA was caught only when some consumer's next PR went
# red, in a different repo, attributed to that consumer's change.
#
# `uses: ./...` is a LOCAL reference, so it resolves from the same commit as this
# caller: a PR changing lint.yml is linted BY the changed lint.yml. (Precisely: a
# pull_request run uses refs/pull/N/merge, i.e. the PR merged into base.)
#
# This file is ALSO lint.yml's MAX canary. It passes all 11 declared inputs on
# purpose: actionlint validates a local uses: against the callee's interface, so
# passing the full set makes a rename or removal of ANY input red here. Dropping
# one from this `with:` silently narrows that coverage, which is why
# .github/scripts/canary_completeness.py asserts the set stays complete.
#
# The four module knobs are false because this repo has no terraform module and
# no go module. That leaves the six file-only linters -- including actionlint,
# which this repo ships to 13 other repos and had never run on itself.
name: Self lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      tflint: false
      trivy: false
      golangci: false
      terraform_docs: false
      tflint_version: "v0.49.0"
      markdownlint_flags: "--disable MD033 MD013 -- ."
      golangci_workdir: "test/"
      golangci_go_version_file: "test/go.mod"
      golangci_workdirs: ""
      golangci_lint_version: "v2.12.2"
      # MUST be the reusable's full default, verbatim. All 11 of lint.yml's jobs
      # run harden-runner with egress-policy: block and allowed-endpoints taken
      # from this input, so a trimmed list strangles every linter -- mdformat is
      # a Python tool and needs pypi. Consumers pass nothing and inherit this
      # list; we must pass it because the MAX canary has to cover all 11 inputs.
      allowed-endpoints: >-
        api.github.com:443
        check.trivy.dev:443
        checkpoint-api.hashicorp.com:443
        dl.google.com:443
        files.pythonhosted.org:443
        ghcr.io:443
        github.com:22
        github.com:443
        go.dev:443
        golang.org:443
        mirror.gcr.io:443
        objects.githubusercontent.com:443
        pkg-containers.githubusercontent.com:443
        proxy.golang.org:443
        pypi.org:443
        raw.githubusercontent.com:443

  canary-completeness:
    name: canary completeness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure PyYAML
        # Runner images ship PyYAML, but do not ASSUME it: probe, then install.
        # `--user` alone can fail with PEP 668 externally-managed-environment on
        # current images, so the fallback carries --break-system-packages.
        run: |
          python3 -c "import yaml; print('PyYAML', yaml.__version__)" ||
            python3 -m pip install --break-system-packages pyyaml==6.0.2
          python3 -c "import yaml"

      - name: Unit-test the guard
        # Runs in CI, not only on the author's laptop. A proof that only ever ran
        # locally is a proof about a session, not about the file.
        run: cd .github/scripts && python3 -m unittest test_canary_completeness -v

      - name: Assert canaries still cover every reusable interface
        run: python3 .github/scripts/canary_completeness.py
